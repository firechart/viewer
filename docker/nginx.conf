# nginx of the image of FireChart Viewer (the Dockerfile of the root): the published files at the root of the host.

# Types the mime.types of nginx 1.27 does not know: the modules of sqlite-wasm (a browser refuses a module of another type);
# added to the types of the http block
types {
    text/javascript mjs;
    application/gzip gz;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    gzip_static on;
    # Revalidated (ETag, a cheap 304): the page, the configuration and the library have no fingerprint, and without a header of ours a proxy
    # (Cloudflare: max-age=14400) keeps the previous release for hours. Who may frame the Viewer is the proxy's frame-ancestors (host.json)
    add_header Cache-Control "no-cache" always;
    # Any other address is a page of the Viewer
    location / {
        try_files $uri $uri/ /index.html;
    }
    # The files of the application: a missing one is a 404, never the page (the Viewer asks for templates that may not exist)
    location ~ ^/(_framework|_content)/ {
        try_files $uri =404;
    }
    # The library: a file of the customer layer (a project of the designer mounted at /usr/share/nginx/appearance) wins over the vendor one
    location ~ ^/library/(.*)$ {
        root /usr/share/nginx;
        try_files /appearance/$1 /html/library/$1 =404;
    }
    # The JavaScript SDK is imported as an ES module by pages of other origins: CORS for any (an add_header here replaces those of the server)
    location /sdk/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
}
