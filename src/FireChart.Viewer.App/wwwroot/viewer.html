<!DOCTYPE html>
<!-- The demo of the Viewer: this application in a frame (embed) through its SDK, as another page embeds it. The server is ?server= (an id of
     demo-presets.json), the place in the Viewer ?fhir= (the urlParam of the SDK): a link opens the same record -->
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>FireChart Viewer: live demo</title>
    <meta name="description" content="Live demo of FireChart Viewer on public FHIR® test servers: resource lists, records and the summary of a patient." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://viewer.firechart.org/viewer.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FireChart" />
    <meta property="og:url" content="https://viewer.firechart.org/viewer.html" />
    <meta property="og:title" content="FireChart Viewer: live demo" />
    <meta property="og:description" content="Browse a public FHIR® server and see the summary of a patient in the browser. Open source, MPL-2.0." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://viewer.firechart.org/img/og-viewer.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The summary of a patient in FireChart Viewer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FireChart Viewer: live demo" />
    <meta name="twitter:description" content="Browse a public FHIR® server and see the summary of a patient in the browser. Open source, MPL-2.0." />
    <meta name="twitter:image" content="https://viewer.firechart.org/img/og-viewer.png" />
    <link rel="icon" href="img/firechart-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/site.css" />
    <link rel="modulepreload" href="./sdk/viewer.js" />
</head>
<body>
<header class="site-header">
    <a class="brand" href="./"><img src="img/firechart-logo.svg" alt="FireChart" /></a>
    <nav>
        <a href="viewer.html" aria-current="page">Viewer</a>
        <a href="bundle.html">Bundle<span class="wide"> Visualizer</span></a>
        <a href="developers.html">Embed</a>
    </nav>
    <a class="github" href="https://github.com/firechart/viewer">GitHub</a>
</header>

<main class="demo">
    <aside>
        <h1>Viewer</h1>
        <p class="intro">
            A public FHIR® server read from your browser. It opens on the summary of a sample patient: follow the references, search any resource
            type. The home button brings you back.
        </p>
        <label>
            <span class="label">Server</span>
            <span class="row">
                <select id="server" aria-label="Server"></select>
                <button id="home" class="button icon" type="button" title="The sample patient of the server" aria-label="Home">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 10.5 12 3l9 7.5" />
                        <path d="M5 9.5V21h5v-6h4v6h5V9.5" />
                    </svg>
                </button>
                <button id="appearance-open" class="button icon" type="button" title="Appearance" aria-label="Appearance">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </button>
            </span>
        </label>
        <p id="description" class="message wide"></p>
        <p class="notice">Public test servers with synthetic data. Do not enter real patient data there.</p>
    </aside>
    <div id="viewer" class="frame"></div>
</main>


<script type="module">
    import { Viewer } from "./sdk/viewer.js";
    import { bindAppearance } from "./assets/appearance.js";
    import { loadPresets, rememberServer } from "./assets/presets.js";

    const app = new URL("./", location.href).href;
    const query = new URLSearchParams(location.search);
    const select = document.getElementById("server");
    const description = document.getElementById("description");
    const home = document.getElementById("home");

    const appearance = bindAppearance(document.getElementById("appearance-open"));
    let { presets, selected: preset } = await loadPresets(app, select);
    // A link with ?fhir= opens its place; otherwise the start of the server once it is ready: the summary of its sample patient, or its resource types
    let opening = !query.has("fhir");

    const show = () => {
        description.textContent = preset.description ?? "";
        home.title = preset.patient ? "The sample patient of the server" : "The resource types of the server";
        rememberServer(preset);
    };
    const openSummary = () => preset.patient ? viewer.navigate(`summary/Patient/${preset.patient}`) : viewer.navigate("resources");

    const viewer = Viewer.create(appearance.apply(preset.config), { url: app, urlParam: "fhir", title: "FireChart Viewer" });
    viewer.on("ready", () => {
        if (opening) {
            opening = false;
            openSummary().catch(console.error);
        }
    });
    viewer.mount("#viewer");
    appearance.attach(viewer);
    show();

    select.onchange = () => {
        preset = presets.find(p => p.id === select.value) ?? presets[0];
        opening = true;
        show();
        viewer.restart(appearance.apply(preset.config)).catch(console.error);
    };
    home.onclick = () => openSummary().catch(console.error);
</script>
</body>
</html>
