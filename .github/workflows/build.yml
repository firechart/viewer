# Builds the solution and runs the unit tests on GitHub's own runners, for every push to main, every pull request and by hand.
# The browser tests (test/Flox.Sqlite.BrowserTests, category Browser) need an installed Chrome or Edge: filtered out, since a run of the whole
# solution runs them although they are explicit.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      # The Tailwind CLI once, then the stylesheets one project after another (as the Dockerfile does): projects that build in parallel would
      # run the CLI while another still writes it. The version comes from the release tag, not from git history (MinVerSkip)
      - name: Stylesheets
        run: |
          dotnet msbuild src/Flox.Shared/Flox.Shared.csproj -restore -t:TailwindDownload -p:Configuration=Release -p:MinVerSkip=true
          dotnet msbuild src/Flox.Shared/Flox.Shared.csproj -restore -t:TailwindBuild -p:Configuration=Release -p:MinVerSkip=true
          dotnet msbuild src/FireChart.Viewer/FireChart.Viewer.csproj -restore -t:TailwindBuild -p:Configuration=Release -p:MinVerSkip=true
          dotnet msbuild src/FireChart.Viewer.App/FireChart.Viewer.App.csproj -restore -t:TailwindBuild -p:Configuration=Release -p:MinVerSkip=true

      # Release: every public member of the libraries must have its XML documentation, and a missing one fails the build
      - name: Build
        run: dotnet build FireChart.Viewer.slnx -c Release -p:MinVerSkip=true

      - name: Test
        run: dotnet test FireChart.Viewer.slnx -c Release --no-build --filter "TestCategory!=Browser" --logger "trx" --results-directory TestResults

      - name: Test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
